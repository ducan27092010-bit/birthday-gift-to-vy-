    <div class="noi-dung-sau-banner"> 
      <div class="content">
            <h2>Liên hệ</h2>
            <div class="info-grid">
                <div class="info-card">
                    <label>Địa chỉ sinh hoạt</label>
                    <p>Sân thể thao Trường THPT Mẫu</p>
                </div>
                <div class="info-card">
                    <label>Email</label>
                    <p>saovang@truong.edu.vn</p>
                </div>
                <div class="info-card">
                    <label>Điện thoại</label>
                    <p>0900 000 000 (số mẫu)</p>
                </div>
            </div>

      
            <h2>  Đăng ký tham gia</h2>
            <form action="#" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="txtHoten">Họ và tên</label>
                        <input type="text" id="txtHoten" name="hoten" placeholder="Nhập họ và tên">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="txtLop">Lớp</label>
                        <input type="text" id="txtLop" name="lop" value="10A1" style="border-color: #718096; color: #718096;">
                    </div>
                </div>

                <div class="form-group-full">
                    <label class="form-label" for="slMonhoc">Môn muốn tham gia</label>
                    <select id="slMonhoc" name="monhoc">
                        <option value="bongda" selected>Bóng đá</option>
                        <option value="bongro">Bóng rổ</option>
                        <option value="caulong">Cầu lông</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Gửi đăng ký</button>
            </form>
        </div>    
    </div>
